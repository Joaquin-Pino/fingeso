spring.application.name=fingeso

# Datos de dev locales -- ajusta si tu Postgres local usa otras credenciales.
spring.datasource.url=jdbc:postgresql://localhost:5432/fingeso
spring.datasource.username=postgres
spring.datasource.password=postgres

# No hay Flyway/Liquibase todavia: Hibernate gestiona el esquema en dev.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Permitir subida de archivos grandes para las entregas de avances (RNF_009)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Configuración de correo (OP-10). Usa variables de entorno para no subir
# credenciales reales al repo -- ver instrucciones abajo para probarlo local.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true