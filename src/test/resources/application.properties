# Override solo para tests: usa H2 en memoria en vez de Postgres, para que
# ./mvnw test valide el mapeo JPA (creacion de tablas via Hibernate) sin
# depender de una instancia de Postgres disponible.
spring.datasource.url=jdbc:h2:mem:fingeso;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
